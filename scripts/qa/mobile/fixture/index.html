<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>移动端 QA fixture</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f5;
        --text: #222222;
        --text-secondary: #5a5a5a;
        --hr: #d0cbc1;
        --link: #3f6499;
        --ir-safe-top: env(safe-area-inset-top, 0px);
        --ir-safe-bottom: env(safe-area-inset-bottom, 0px);
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1c;
          --text: #e2ddd4;
          --text-secondary: #a9a49b;
          --hr: #3a3a36;
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
      body { min-height: 100vh; padding-top: var(--ir-safe-top); padding-bottom: var(--ir-safe-bottom); }
      button { min-height: 44px; min-width: 44px; border: 1px solid var(--hr); border-radius: 8px; background: transparent; color: var(--text); font: inherit; }
      .screen { display: none; }
      .screen[data-active="true"] { display: block; }
      [data-testid="shelf-continue"] { display: block; width: 100%; text-align: left; padding: 16px; margin-bottom: 8px; }
      .shelf-list { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
      .shelf-book { display: block; width: 100%; text-align: left; padding: 12px; }
      .topbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--hr); }
      .topbar .spacer { flex: 1; }
      [data-testid="reader-toolbar"] { position: sticky; top: 0; background: var(--bg); z-index: 2; }
      [data-testid="reader-body"] { padding: 16px; line-height: 1.8; }
      [data-testid="reader-progress"] { position: fixed; bottom: 0; left: 0; right: 0; height: 3px; background: var(--link); width: 34%; }
      .sheet { display: none; position: fixed; inset: auto 0 0 0; max-height: 70vh; overflow: auto; background: var(--bg); border-top: 1px solid var(--hr); padding: 16px; }
      .sheet[data-open="true"] { display: block; }
      .sheet button { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
      [data-testid="focus-hud"] { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--hr); padding: 12px; text-align: center; }
      [data-testid="focus-hud"][data-open="true"] { display: block; }
      [data-testid="settings-screen"], [data-testid="import-sheet"] { padding: 16px; }
      h1 { font-size: 20px; margin: 8px 0 16px; }
      p { margin: 0 0 14px; }
    </style>
  </head>
  <body>
    <p id="fixture-banner" style="padding: 8px 12px; font-size: 12px; color: var(--text-secondary)">
      QA fixture（非真实构建产物）：仅用于验证 scripts/qa/mobile/verify_mobile.py 的 mock 与断言逻辑。
    </p>

    <!-- shelf -->
    <section class="screen" data-screen="shelf" data-active="true">
      <div class="topbar">
        <strong>沉浸阅读</strong>
        <span class="spacer"></span>
        <button type="button" data-testid="shelf-import" aria-label="导入书籍">导入</button>
        <button type="button" data-testid="shelf-settings" aria-label="设置">设置</button>
      </div>
      <div style="padding: 12px">
        <button type="button" data-testid="shelf-continue" aria-label="继续阅读">
          <span id="continue-title">继续阅读</span>
        </button>
      </div>
      <div class="shelf-list" id="shelf-list"></div>
    </section>

    <!-- reader -->
    <section class="screen" data-screen="reader" data-testid="reader-screen">
      <div class="topbar" data-testid="reader-toolbar">
        <button type="button" data-testid="reader-back" aria-label="返回">返回</button>
        <strong id="reader-title">阅读</strong>
        <span class="spacer"></span>
        <button type="button" data-testid="reader-toc" aria-label="目录">目录</button>
        <button type="button" data-testid="reader-settings" aria-label="阅读设置">设置</button>
        <button type="button" data-testid="reader-focus-toggle" aria-label="专注">专注</button>
      </div>
      <div data-testid="reader-content" id="reader-content"></div>
      <div data-testid="reader-progress" aria-label="阅读进度"></div>
    </section>

    <!-- settings (top level) -->
    <section class="screen" data-screen="settings" data-testid="settings-screen">
      <div class="topbar">
        <button type="button" data-testid="settings-back" aria-label="返回">返回</button>
        <strong>阅读设置</strong>
      </div>
      <div style="padding: 16px">
        <p>主题 / 字号 / 行高 / 页宽 / 字体 / 音量键翻页 / 缓存清理</p>
        <p id="settings-version">版本 1.3.0-qa</p>
      </div>
    </section>

    <!-- sheets -->
    <div class="sheet" data-testid="toc-sheet" data-open="false">
      <div id="toc-list"></div>
    </div>
    <div class="sheet" data-testid="import-sheet" data-open="false">
      <strong>导入书籍</strong>
      <p id="import-status">等待选择文件…</p>
    </div>
    <div class="sheet" data-testid="reader-settings-panel" data-open="false">
      <strong>阅读设置</strong>
      <p>字号 / 行高 / 页宽 / 主题</p>
    </div>
    <div data-testid="focus-hud" data-open="false">
      <button type="button" data-testid="focus-hud-prev" aria-label="上一句">上一句</button>
      <span id="focus-hud-label">第 1/1 句</span>
      <button type="button" data-testid="focus-hud-next" aria-label="下一句">下一句</button>
      <button type="button" data-testid="focus-hud-exit" aria-label="退出专注">退出</button>
    </div>

    <script>
      // Fixture shell: talks to the injected window.__TAURI_INTERNALS__ mock so
      // the QA harness exercises the same invoke routes as the real build.
      window.__IR_FIXTURE__ = true;
      const invoke = (command, args) => window.__TAURI_INTERNALS__.invoke(command, args);
      const $ = (testid) => document.querySelector(`[data-testid="${testid}"]`);

      const state = { target: null, chapterIndex: 0, chapters: [], isEpub: false };

      function showScreen(name) {
        document.querySelectorAll("[data-screen]").forEach((el) => {
          el.dataset.active = String(el.dataset.screen === name);
        });
      }

      function openSheet(testid, open) {
        const el = $(testid);
        if (el) el.dataset.open = String(open);
      }

      function renderShelf(books) {
        const list = document.getElementById("shelf-list");
        list.innerHTML = "";
        for (const book of books) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "shelf-book";
          button.dataset.testid = `shelf-book-${book.bookId}`;
          button.textContent = `${book.title} · ${book.chapterCount} 章 · ${Math.round(book.progress * 100)}%`;
          button.addEventListener("click", () => openBook(book.bookId));
          list.appendChild(button);
        }
        const continued = books.find((book) => book.progress > 0) || books[0];
        if (continued) {
          const card = $("shelf-continue");
          card.querySelector("#continue-title").textContent = `继续阅读：${continued.title}`;
          card.onclick = () => openBook(continued.bookId);
        }
      }

      async function openBook(bookId) {
        const detail = await invoke("open_book", { bookId });
        state.target = detail;
        state.isEpub = detail.publication?.format === "epub";
        state.chapters = detail.manifest.chapters;
        state.chapterIndex = Math.max(
          0,
          state.chapters.findIndex((chapter) => chapter.id === detail.progress.current),
        );
        showScreen("reader");
        document.getElementById("reader-title").textContent = detail.manifest.title;
        await renderChapter(state.chapters[state.chapterIndex].id);
        renderToc();
      }

      async function renderChapter(chapterId) {
        const chapter = await invoke("get_readable_chapter", {
          bookId: state.target.manifest.bookId,
          chapterId,
        });
        const body = $("reader-content");
        if (chapter.format === "xhtml") {
          body.innerHTML = chapter.content;
        } else {
          // Fixture does not ship the real markdown pipeline: show the plain
          // text so the harness can assert the chapter marker and scrolling.
          body.textContent = chapter.content;
          body.innerHTML = `<h1>${chapter.title}</h1>` + body.innerHTML.replace(/\n\n/g, "</p><p>");
          body.querySelectorAll("p").forEach((p) => { p.style.margin = "0 0 14px"; });
        }
        $("reader-progress").dataset.chapter = chapter.chapterId;
        $("reader-progress").style.width = `${((state.chapterIndex + 1) / state.chapters.length) * 100}%`;
      }

      function renderToc() {
        const list = document.getElementById("toc-list");
        list.innerHTML = "";
        state.chapters.forEach((chapter, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.testid = `toc-item-${index}`;
          button.textContent = chapter.title;
          button.addEventListener("click", async () => {
            state.chapterIndex = index;
            await renderChapter(chapter.id);
            openSheet("toc-sheet", false);
          });
          list.appendChild(button);
        });
      }

      $("shelf-settings").addEventListener("click", () => showScreen("settings"));
      $("settings-back").addEventListener("click", () => showScreen("shelf"));
      $("shelf-import").addEventListener("click", async () => {
        openSheet("import-sheet", true);
        const uris = await invoke("plugin:dialog|open", { options: {} });
        if (!Array.isArray(uris) || uris.length === 0) {
          document.getElementById("import-status").textContent = "已取消";
          return;
        }
        document.getElementById("import-status").textContent = `已选择 ${uris.length} 个文件`;
        const { operationId } = await invoke("begin_import", { kind: "uris", uris });
        await invoke("get_import_status", { operationId });
        document.getElementById("import-status").textContent = "导入中…";
      });
      document.querySelector('[data-testid="import-sheet"]').addEventListener("click", (event) => {
        if (event.target === event.currentTarget) openSheet("import-sheet", false);
      });
      $("reader-back").addEventListener("click", () => showScreen("shelf"));
      $("reader-toc").addEventListener("click", () => openSheet("toc-sheet", true));
      $("reader-settings").addEventListener("click", () => openSheet("reader-settings-panel", true));
      $("reader-focus-toggle").addEventListener("click", () => openSheet("focus-hud", true));
      $("focus-hud-exit").addEventListener("click", () => openSheet("focus-hud", false));
      $("toc-sheet").addEventListener("click", (event) => {
        if (event.target === event.currentTarget) openSheet("toc-sheet", false);
      });
      $("reader-settings-panel").addEventListener("click", (event) => {
        if (event.target === event.currentTarget) openSheet("reader-settings-panel", false);
      });

      invoke("scan_library").then((scan) => renderShelf(scan.books));
    </script>
  </body>
</html>
