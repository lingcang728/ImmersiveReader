[package]
name = "immersive-reader"
version = "1.2.1"
description = "A local-first immersive reading library"
authors = ["lingcang728"]
edition = "2021"
# Tauri 2's documented floor; the pinned toolchain (see rustup) is newer.
rust-version = "1.77.2"

[lib]
name = "immersive_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Size/speed tuning for the shipped NSIS bundle: full LTO + single codegen
# unit, and strip symbols (Windows PDB is separate; nothing consumes embedded
# debug info at runtime).
lto = true
codegen-units = 1
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Mobile file import (content:// SAF picks) reads/writes through this plugin;
# 2.4.5 is the version already locked transitively via tauri-plugin-dialog.
tauri-plugin-fs = "2.4.5"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
percent-encoding = "2"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
