name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            tools/zhihu-packer/package-lock.json
            packages/contracts/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix tools/zhihu-packer
          npm ci --prefix packages/contracts
          python -m pip install --quiet -r tools/podcast-transcriber/requirements-dev.txt

      - name: Contracts parity and tests
        shell: pwsh
        run: |
          python scripts/verify_contract_parity.py
          npm test --prefix packages/contracts
          npm run build --prefix packages/contracts

      - name: Ensure sqlite3
        # migration/sqlite_tests.rs shells out to sqlite3.exe; presence on
        # windows-latest is not guaranteed — install rather than fail midway.
        shell: pwsh
        run: |
          if (-not (Get-Command sqlite3.exe -ErrorAction SilentlyContinue)) {
            choco install sqlite -y --no-progress
          }
          sqlite3 --version

      - name: Desktop checks
        shell: pwsh
        run: |
          npm run check --prefix apps/desktop
          npm test --prefix apps/desktop
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Zhihu packer build and tests
        shell: pwsh
        run: |
          npm run build --prefix tools/zhihu-packer
          npm run compile-reader --prefix tools/zhihu-packer
          npm test --prefix tools/zhihu-packer

      - name: Podcast transcriber lint and tests
        shell: pwsh
        run: |
          ruff check tools/podcast-transcriber/scripts tools/podcast-transcriber/tests
          Push-Location tools/podcast-transcriber
          try {
            python -m pytest -q
            python scripts/quick_validate.py
          } finally {
            Pop-Location
          }

      # Scripts.Tests.ps1 targets Pester 3.4 syntax (`Should Be`, top-level
      # helpers), which only ships with Windows PowerShell 5.1 — pwsh 7 gets
      # Pester 5 where these helpers disappear between discovery and run.
      - name: PowerShell script tests
        shell: powershell
        run: |
          $result = Invoke-Pester -Path scripts/tests -PassThru
          if ($result.FailedCount -gt 0) { throw "Pester failed: $($result.FailedCount) test(s)" }
