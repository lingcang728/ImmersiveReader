name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Acquire verified managed runtime bundle
        env:
          RUNTIME_BUNDLE_URL: ${{ secrets.IMMERSIVE_READER_RUNTIME_BUNDLE_URL }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:RUNTIME_BUNDLE_URL) {
            Invoke-WebRequest -Uri $env:RUNTIME_BUNDLE_URL -OutFile runtime-bundle.zip
          } else {
            New-Item -ItemType Directory -Force -Path .runtime-parts | Out-Null
            gh release download '${{ github.ref_name }}' --pattern 'runtime-bundle.zip.*' --dir .runtime-parts
            if ($LASTEXITCODE -ne 0) { throw '无法从当前 Release 下载托管 Runtime 分卷。' }
            $parts = @(Get-ChildItem -LiteralPath .runtime-parts -Filter 'runtime-bundle.zip.*' -File | Sort-Object Name)
            if ($parts.Count -eq 0) { throw '当前 Release 不包含托管 Runtime 分卷。' }
            $target = [System.IO.File]::Create((Join-Path (Get-Location) 'runtime-bundle.zip'))
            try {
              foreach ($part in $parts) {
                $source = [System.IO.File]::OpenRead($part.FullName)
                try { $source.CopyTo($target) } finally { $source.Dispose() }
              }
            } finally {
              $target.Dispose()
            }
          }
          if (Test-Path -LiteralPath runtime) { Remove-Item -LiteralPath runtime -Recurse -Force }
          Expand-Archive -LiteralPath runtime-bundle.zip -DestinationPath .runtime-unpack -Force
          $nested = Join-Path (Get-Location) ".runtime-unpack\runtime"
          if (Test-Path -LiteralPath $nested) {
            Move-Item -LiteralPath $nested -Destination runtime
          } else {
            Move-Item -LiteralPath (Join-Path (Get-Location) ".runtime-unpack") -Destination runtime
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\verify-runtime.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Install Zhihu build dependencies
        run: npm ci --prefix tools/zhihu-packer

      - name: Build contracts and Zhihu reader
        shell: pwsh
        run: |
          npm exec --yes --package=typescript@5.7.3 -- tsc -p packages/contracts/tsconfig.json
          npm exec --yes --package=tsx@4.19.2 -- node --import tsx --test packages/contracts/tests/*.test.ts
          npm run build --prefix tools/zhihu-packer
          npm run compile-reader --prefix tools/zhihu-packer
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\prepare-runtime.ps1 -RefreshApps
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\verify-runtime.ps1

      - name: Build signed Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -cne "v$version") { throw 'Tag and package version differ.' }
          npm run tauri --prefix apps/desktop -- build --bundles nsis
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps/desktop/scripts/collect-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $installer = (Get-ChildItem -LiteralPath output/release -Filter 'ImmersiveReader_*-setup.exe' -File | Select-Object -First 1).FullName
          if ($exists) {
            gh release upload '${{ github.ref_name }}' $installer output/release/latest.json --clobber
            gh release edit '${{ github.ref_name }}' --draft=false --prerelease=false --title "沉浸阅读 ${{ github.ref_name }}" --notes-file docs/release/1.2.0/RELEASE_NOTES.md
          } else {
            gh release create '${{ github.ref_name }}' --verify-tag --title "沉浸阅读 ${{ github.ref_name }}" --notes-file docs/release/1.2.0/RELEASE_NOTES.md $installer output/release/latest.json
          }
