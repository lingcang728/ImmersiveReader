name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify managed runtime release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $expected = Get-Content "docs/release/$version/runtime-parts.json" -Raw | ConvertFrom-Json
          $release = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '无法读取当前 GitHub Release。' }
          foreach ($part in @($expected.parts)) {
            $asset = @($release.assets | Where-Object name -eq $part.name)
            if ($asset.Count -ne 1) { throw "Runtime 分卷缺失或重名：$($part.name)" }
            if ([int64]$asset[0].size -ne [int64]$part.size) { throw "Runtime 分卷大小不匹配：$($part.name)" }
            if ([string]$asset[0].digest -ine "sha256:$($part.sha256)") { throw "Runtime 分卷 SHA-256 不匹配：$($part.name)" }
          }
          $total = (@($expected.parts) | Measure-Object -Property size -Sum).Sum
          if ([int64]$total -ne [int64]$expected.bundle.size) { throw 'Runtime 分卷总大小与完整包不一致。' }
          Write-Host "Runtime Release assets verified: $(@($expected.parts).Count) parts, $total bytes."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Install Zhihu build dependencies
        run: npm ci --prefix tools/zhihu-packer

      - name: Build contracts and Zhihu reader
        shell: pwsh
        run: |
          npm exec --yes --package=typescript@5.7.3 -- tsc -p packages/contracts/tsconfig.json
          npm exec --yes --package=tsx@4.19.2 -- node --import tsx --test packages/contracts/tests/*.test.ts
          npm run build --prefix tools/zhihu-packer
          npm run compile-reader --prefix tools/zhihu-packer
          npm test --prefix tools/zhihu-packer

      - name: Build signed Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -cne "v$version") { throw 'Tag and package version differ.' }
          npm run tauri --prefix apps/desktop -- build --bundles nsis
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps/desktop/scripts/collect-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $installer = (Get-ChildItem -LiteralPath output/release -Filter 'ImmersiveReader_*-setup.exe' -File | Select-Object -First 1).FullName
          if ($exists) {
            gh release upload '${{ github.ref_name }}' $installer output/release/latest.json --clobber
            gh release edit '${{ github.ref_name }}' --draft=false --prerelease=false --title "沉浸阅读 ${{ github.ref_name }}" --notes-file docs/release/1.2.0/RELEASE_NOTES.md
          } else {
            gh release create '${{ github.ref_name }}' --verify-tag --title "沉浸阅读 ${{ github.ref_name }}" --notes-file docs/release/1.2.0/RELEASE_NOTES.md $installer output/release/latest.json
          }
