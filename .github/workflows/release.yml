name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify managed runtime release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $expected = Get-Content "docs/release/$version/runtime-parts.json" -Raw | ConvertFrom-Json
          # Query the tag's release directly: the paged list endpoint silently
          # drops the target once a repo has >100 releases.
          $release = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '当前 Tag 的草稿 Release 缺失或不可读。' }
          foreach ($part in @($expected.parts)) {
            $asset = @($release.assets | Where-Object name -eq $part.name)
            if ($asset.Count -ne 1) { throw "Runtime 分卷缺失或重名：$($part.name)" }
            if ([int64]$asset[0].size -ne [int64]$part.size) { throw "Runtime 分卷大小不匹配：$($part.name)" }
            if ([string]$asset[0].digest -ine "sha256:$($part.sha256)") { throw "Runtime 分卷 SHA-256 不匹配：$($part.name)" }
          }
          $total = (@($expected.parts) | Measure-Object -Property size -Sum).Sum
          if ([int64]$total -ne [int64]$expected.bundle.size) { throw 'Runtime 分卷总大小与完整包不一致。' }
          Write-Host "Runtime Release assets verified: $(@($expected.parts).Count) parts, $total bytes."

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            tools/zhihu-packer/package-lock.json
            packages/contracts/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Install Zhihu build dependencies
        run: npm ci --prefix tools/zhihu-packer

      - name: Install contracts toolchain
        run: npm ci --prefix packages/contracts

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Ensure sqlite3
        # migration/sqlite_tests.rs shells out to sqlite3.exe; presence on
        # windows-latest is not guaranteed — install rather than fail midway.
        shell: pwsh
        run: |
          if (-not (Get-Command sqlite3.exe -ErrorAction SilentlyContinue)) {
            choco install sqlite -y --no-progress
          }
          sqlite3 --version

      - name: Run tests and contract parity
        shell: pwsh
        run: |
          python -m pip install --quiet -r tools/podcast-transcriber/requirements-dev.txt
          python scripts/verify_contract_parity.py
          npm test --prefix packages/contracts
          npm run build --prefix packages/contracts
          npm run check --prefix apps/desktop
          npm test --prefix apps/desktop
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Build contracts and Zhihu reader
        shell: pwsh
        run: |
          npm run build --prefix tools/zhihu-packer
          npm run compile-reader --prefix tools/zhihu-packer
          npm test --prefix tools/zhihu-packer

      - name: Podcast transcriber lint and tests
        shell: pwsh
        run: |
          ruff check tools/podcast-transcriber/scripts tools/podcast-transcriber/tests
          Push-Location tools/podcast-transcriber
          try {
            python -m pytest -q
            python scripts/quick_validate.py
          } finally {
            Pop-Location
          }

      - name: Build signed Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoToml = Get-Content apps/desktop/src-tauri/Cargo.toml -Raw
          $packageSection = [regex]::Match($cargoToml, '(?ms)^\[package\](.*?)(?=^\[)')
          if (-not $packageSection.Success) { throw 'Cargo.toml is missing a [package] section.' }
          $cargoMatch = [regex]::Match($packageSection.Groups[1].Value, '(?m)^\s*version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw 'Cargo.toml [package] is missing a version.' }
          $cargoVersion = $cargoMatch.Groups[1].Value
          if ($version -cne $tauriVersion -or $version -cne $cargoVersion) {
            throw "Version mismatch: package.json=$version tauri.conf.json=$tauriVersion Cargo.toml=$cargoVersion"
          }
          if ('${{ github.ref_name }}' -cne "v$version") { throw 'Tag and package version differ.' }
          npm run tauri --prefix apps/desktop -- build --bundles nsis
          pwsh -NoProfile -File apps/desktop/scripts/collect-release.ps1

      - name: Verify updater signature
        shell: pwsh
        run: |
          # A corrupt .sig or a mismatched TAURI_SIGNING_PRIVATE_KEY would ship
          # a silently broken update channel — verify installer+signature
          # against the pubkey baked into tauri.conf.json before publishing.
          $minisignZip = "$env:RUNNER_TEMP\minisign-0.12-win64.zip"
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $minisignZip
          $expectedSha = '37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $minisignZip).Hash -cne $expectedSha) {
            throw 'minisign 下载完整性校验失败。'
          }
          Expand-Archive -LiteralPath $minisignZip -DestinationPath "$env:RUNNER_TEMP\minisign" -Force
          $minisign = "$env:RUNNER_TEMP\minisign\minisign-win64\x86_64\minisign.exe"
          $pubkeyB64 = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          $pubkeyFile = "$env:RUNNER_TEMP\updater.pub"
          [IO.File]::WriteAllBytes($pubkeyFile, [Convert]::FromBase64String($pubkeyB64))
          $installer = (Get-ChildItem -LiteralPath output/desktop -Filter 'ImmersiveReader_*-setup.exe' -File | Select-Object -First 1).FullName
          if (-not $installer) { throw 'output/desktop 下没有 NSIS 安装包可供验签。' }
          $sig = "$installer.sig"
          if (-not (Test-Path -LiteralPath $sig -PathType Leaf)) { throw "updater 签名文件缺失：$sig" }
          & $minisign -V -m $installer -x $sig -p $pubkeyFile
          if ($LASTEXITCODE -ne 0) { throw "updater 签名验签失败：$installer" }
          # latest.json must embed exactly the verified signature text.
          $latest = Get-Content output/desktop/latest.json -Raw | ConvertFrom-Json
          $embedded = [string]$latest.platforms.'windows-x86_64'.signature
          if ($embedded.Trim() -cne (Get-Content $sig -Raw).Trim()) {
            throw 'latest.json 内嵌签名与 .sig 文件不一致。'
          }
          Write-Host 'Updater signature verified against tauri.conf.json pubkey.'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notesFile = "docs/release/$version/RELEASE_NOTES.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes missing for $version: $notesFile"
          }
          # The first step already asserted exactly one Release exists for this
          # tag, so a create-from-scratch fallback here can never run — upload
          # into the verified draft instead of maintaining a dead else branch.
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -ne 0) { throw '当前 Tag 的 GitHub Release 不存在。' }
          $global:LASTEXITCODE = 0
          $installer = (Get-ChildItem -LiteralPath output/desktop -Filter 'ImmersiveReader_*-setup.exe' -File | Select-Object -First 1).FullName
          if (-not $installer -or -not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'output/desktop 下没有 NSIS 安装包，拒绝发布空 Release。'
          }
          if (-not (Test-Path -LiteralPath 'output/desktop/latest.json' -PathType Leaf)) {
            throw 'output/desktop/latest.json 缺失，拒绝发布。'
          }
          # gh is a native CLI: pwsh does NOT turn a non-zero exit code into a
          # terminating error — check every gh call or a failed upload would
          # silently publish a Release with no installer.
          gh release upload '${{ github.ref_name }}' $installer output/desktop/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload 失败（exit $LASTEXITCODE）。" }
          gh release edit '${{ github.ref_name }}' --draft=false --prerelease=false --title "沉浸阅读 ${{ github.ref_name }}" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "gh release edit 失败（exit $LASTEXITCODE）。" }
